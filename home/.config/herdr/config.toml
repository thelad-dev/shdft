onboarding = false

[theme]
name = "dracula"
auto_switch = false

[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+a"
focus_pane_down  = "prefix+s"
focus_pane_up    = "prefix+w"
focus_pane_right = "prefix+d"
split_horizontal = "prefix+minus"
split_vertical    = "prefix+plus"
new_tab   = "prefix+t"
close_tab = "prefix+q"
detach    = "prefix+backspace"
settings  = "prefix+comma"
help      = "prefix+?"
workspace_picker = "prefix+space"
goto             = "prefix+g"
edit_scrollback = "prefix+y"

[ui]
agent_panel_sort = "spaces"
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
